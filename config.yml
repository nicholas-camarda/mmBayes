default:
  runtime:
    slug: "mmBayes"
    root: "~/Workspaces/mmbayes/runtime"
    exports_root: "~/Workspaces/mmbayes/runtime/exports"
  data:
    team_features_path: "~/Library/CloudStorage/OneDrive-Personal/Project Vault/Personal Projects/mmbayes/data/pre_tournament_team_features.xlsx"
    game_results_path: "~/Library/CloudStorage/OneDrive-Personal/Project Vault/Personal Projects/mmbayes/data/tournament_game_results.xlsx"
    espn_raw_dir: "~/Library/CloudStorage/OneDrive-Personal/Project Vault/Personal Projects/mmbayes/data/raw/espn"
  model:
    # All completed seasons since 2008 (#12: window and recency weighting did
    # not change held-out accuracy).
    history_window: all
    backtest: true
    engine: "stan_glm"
    # Alternatives are compared by scripts/evaluate_model_selection.R.
    compare_engines: false
    allow_unavailable_comparison: false
    bart:
      n_trees: 200
      n_burn: 500
      n_post: 1000
      k: 2
      power: 2
    # Production winner model (#12): Barthag logit difference only. Adding the
    # other twelve features, BART, or blends did not improve held-out log loss.
    required_predictors:
      - barthag_logit_diff
    interaction_terms: []
    prior_type: "normal"
    random_seed: 42
    n_draws: 1000
  output:
    path: "~/Workspaces/mmbayes/runtime/output"
    prefix: "tournament_sim"
    model_cache_path: "~/Workspaces/mmbayes/runtime/output/model_cache"
    log_path: "~/Workspaces/mmbayes/runtime/output/logs/tournament_simulation.log"
    refresh_log_path: "~/Workspaces/mmbayes/runtime/output/logs/data_refresh.log"
