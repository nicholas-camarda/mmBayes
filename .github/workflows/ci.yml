name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-tests:
    name: R tests (synthetic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::pkgload, any::testthat

      - name: Run testthat suite
        run: Rscript tests/testthat.R

  frontend:
    name: Frontend lint, unit tests, build and interaction tests
    # Pinned: Playwright 1.58 does not support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and format check
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build dashboards
        working-directory: frontend
        run: npm run build

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Visual-regression baselines are macOS screenshots, so only the
      # interaction tests run here; run `npm run test:visual` locally.
      - name: Interaction tests (Playwright)
        run: npx playwright test e2e/frontend_app.spec.cjs
